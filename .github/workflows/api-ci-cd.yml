name: API CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

  build-and-push:
    name: Build and Push API Image
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      image_name: ${{ steps.image_vars.outputs.image_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image_vars
        run: |
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=ghcr.io/${owner_lc}/api" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image_vars.outputs.image_name }}:latest
            ${{ steps.image_vars.outputs.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Validate secrets
        id: deploy_gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_API_DIR: ${{ secrets.VPS_API_DIR }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          missing=0
          for key in VPS_HOST VPS_SSH_USER VPS_SSH_KEY VPS_API_DIR GHCR_USER GHCR_PAT; do
            if [ -z "${!key}" ]; then
              echo "::warning::Missing required secret: ${key}"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy due to missing secrets."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Normalize SSH key
        if: ${{ steps.deploy_gate.outputs.enabled == 'true' }}
        id: ssh_key
        env:
          RAW_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RAW_SSH_KEY"
          if [[ "$key" == *"\\n"* ]]; then
            key="${key//\\n/$'\n'}"
          fi

          if ! grep -Eq -- "-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----" <<< "$key"; then
            echo "::error::Invalid private key format."
            exit 1
          fi

          {
            echo "private_key<<EOF"
            echo "$key"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: SSH deploy with rollback
        if: ${{ steps.deploy_gate.outputs.enabled == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ steps.ssh_key.outputs.private_key }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_API_DIR }}"
            export API_IMAGE="${{ needs.build-and-push.outputs.image_name }}:${{ github.sha }}"

            if docker info >/dev/null 2>&1; then
              DOCKER_CMD=(docker)
            elif command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
              DOCKER_CMD=(sudo -E docker)
            else
              echo "Docker daemon not accessible."
              exit 1
            fi

            if [ -f ".env.prod" ]; then
              ENV_FILE=".env.prod"
            elif [ -f ".env" ]; then
              ENV_FILE=".env"
              echo "Using .env because .env.prod was not found."
            else
              echo "No env file found in $(pwd). Expected .env.prod or .env."
              exit 1
            fi
            export API_ENV_FILE="${ENV_FILE}"

            echo "Capturing currently running image..."
            CURRENT_CONTAINER_ID="$("${DOCKER_CMD[@]}" compose -f docker-compose.prod.yml --env-file "${ENV_FILE}" ps -q api || true)"

            if [ -n "$CURRENT_CONTAINER_ID" ]; then
              PREVIOUS_IMAGE="$("${DOCKER_CMD[@]}" inspect "$CURRENT_CONTAINER_ID" --format='{{.Config.Image}}')"
              echo "Previous image: $PREVIOUS_IMAGE"
            else
              PREVIOUS_IMAGE=""
              echo "No previous container found."
            fi

            pulled_image=false
            OVERRIDE_FILE="$(mktemp)"
            printf 'services:\n  api:\n    image: "%s"\n' "${API_IMAGE}" > "${OVERRIDE_FILE}"

            if echo "${{ secrets.GHCR_PAT }}" | "${DOCKER_CMD[@]}" login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin; then
              if "${DOCKER_CMD[@]}" compose -f docker-compose.prod.yml -f "${OVERRIDE_FILE}" --env-file "${ENV_FILE}" pull api; then
                pulled_image=true
                "${DOCKER_CMD[@]}" compose -f docker-compose.prod.yml -f "${OVERRIDE_FILE}" --env-file "${ENV_FILE}" up -d --no-deps api
                "${DOCKER_CMD[@]}" logout ghcr.io || true
              else
                echo "Image pull failed. Falling back to local build."
              fi
            else
              echo "Login failed. Falling back to local build."
            fi

            if [ "${pulled_image}" != "true" ]; then
              if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                git pull --ff-only origin main || echo "Warning: git pull failed."
              fi
              "${DOCKER_CMD[@]}" compose -f docker-compose.prod.yml --env-file "${ENV_FILE}" build api
              "${DOCKER_CMD[@]}" compose -f docker-compose.prod.yml --env-file "${ENV_FILE}" up -d --no-deps api
            fi

            echo "Running health check..."
            CONTAINER_ID=$("${DOCKER_CMD[@]}" compose -f docker-compose.prod.yml --env-file "${ENV_FILE}" ps -q api)

            success=false
            for i in {1..10}; do
              if "${DOCKER_CMD[@]}" exec "$CONTAINER_ID" wget -q --spider http://localhost:4000/api/v1/health >/dev/null 2>&1; then
                success=true
                break
              fi
              echo "Health check attempt $i failed. Retrying in 5s..."
              sleep 5
            done

            if [ "$success" != "true" ]; then
              echo "New deployment unhealthy."

              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Rolling back to $PREVIOUS_IMAGE"
                ROLLBACK_OVERRIDE="$(mktemp)"
                printf 'services:\n  api:\n    image: "%s"\n' "${PREVIOUS_IMAGE}" > "${ROLLBACK_OVERRIDE}"
                "${DOCKER_CMD[@]}" compose -f docker-compose.prod.yml -f "${ROLLBACK_OVERRIDE}" --env-file "${ENV_FILE}" up -d --no-deps api
                rm -f "${ROLLBACK_OVERRIDE}"
                echo "Rollback completed."
              else
                echo "No previous image available for rollback."
              fi

              rm -f "${OVERRIDE_FILE}"
              exit 1
            fi

            echo "Deployment successful."
            "${DOCKER_CMD[@]}" compose -f docker-compose.prod.yml --env-file "${ENV_FILE}" ps
            rm -f "${OVERRIDE_FILE}"
