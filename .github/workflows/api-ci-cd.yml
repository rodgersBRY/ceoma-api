name: API CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

  build-and-push:
    name: Build and Push API Image
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      image_name: ${{ steps.image_vars.outputs.image_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image_vars
        run: |
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image_name=ghcr.io/${owner_lc}/api" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image_vars.outputs.image_name }}:latest
            ${{ steps.image_vars.outputs.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Check deploy secret configuration
        id: deploy_gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_API_DIR: ${{ secrets.VPS_API_DIR }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          missing=0
          for key in VPS_HOST VPS_SSH_USER VPS_SSH_KEY VPS_API_DIR GHCR_USER GHCR_PAT; do
            if [ -z "${!key}" ]; then
              echo "::warning::Missing required secret: ${key}"
              missing=1
            fi
          done

          if [ "$missing" -eq 1 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping VPS deploy because required secrets are not configured."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Normalize SSH key
        if: ${{ steps.deploy_gate.outputs.enabled == 'true' }}
        id: ssh_key
        env:
          RAW_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          key="$RAW_SSH_KEY"
          if [[ "$key" == *"\\n"* ]]; then
            key="${key//\\n/$'\n'}"
          fi

          if ! grep -Eq -- "-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----" <<< "$key"; then
            echo "::error::VPS_SSH_KEY is not a valid private key block."
            exit 1
          fi

          {
            echo "private_key<<EOF"
            echo "$key"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: SSH deploy
        if: ${{ steps.deploy_gate.outputs.enabled == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ steps.ssh_key.outputs.private_key }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_API_DIR }}"
            export API_IMAGE="${{ needs.build-and-push.outputs.image_name }}:${{ github.sha }}"
            
            if docker info >/dev/null 2>&1; then
              DOCKER_CMD=(docker)
            elif command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
              DOCKER_CMD=(sudo -E docker)
            else
              echo "Docker daemon is not accessible for user $(whoami). Add this user to docker group or allow passwordless sudo for docker."
              exit 1
            fi

            OVERRIDE_FILE="$(mktemp)"
            printf 'services:\n  api:\n    image: "%s"\n' "${API_IMAGE}" > "${OVERRIDE_FILE}"

            echo "${{ secrets.GHCR_PAT }}" | "${DOCKER_CMD[@]}" login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            "${DOCKER_CMD[@]}" compose -f docker-compose.prod.yml -f "${OVERRIDE_FILE}" --env-file .env.prod pull api
            "${DOCKER_CMD[@]}" compose -f docker-compose.prod.yml -f "${OVERRIDE_FILE}" --env-file .env.prod up -d --no-deps api
            "${DOCKER_CMD[@]}" compose -f docker-compose.prod.yml -f "${OVERRIDE_FILE}" --env-file .env.prod ps
            curl -fsS http://localhost:4000/api/v1/health >/dev/null
            "${DOCKER_CMD[@]}" logout ghcr.io
            rm -f "${OVERRIDE_FILE}"
